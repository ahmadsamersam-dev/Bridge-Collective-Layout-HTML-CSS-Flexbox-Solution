<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <title>Grid landing page</title>
</head>

<body>
  <div class="container">
    <header>
      <p>Bridge Collective</p>
      <img src="./photos/icon-menu.svg" alt="icon-menu">
    </header>
    <section>
      <h1>A classroom for every child.</h1>
      <p>We fund the schools, train the teachers, and measure what works - so every child we reach today becomes a graduate tomorrow.</p>
    </section>
    <aside>
      <div class="page1">
        <figure>
          <img src="photos/icon-sparkle.svg" alt="icon-sparkle">
          <h2>2.4M</h2>
          <figcaption>
            <h3>Students reached</h3>
            <p>Across 31 countries since 2011.</p>
          </figcaption>
        </figure>
      </div>
      <div class="page2">
        <figure>
          <img src="photos/icon-plus.svg" alt="icon-plus">
          <h2>1,284</h2>
          <figcaption>
            <h3>Schools partnered</h3>
            <p>In 14 countries, from Kenya to Guatemala.</p>
          </figcaption>
        </figure>
      </div>
      <div class="page3">
        <figure>
          <img src="photos/icon-arrow-right.svg" alt="icon-arrow-right">
          <h2>38k</h2>
          <figcaption>
            <h3>Teachers trained</h3>
            <p>Equipped with modern tools and methodology.</p>
          </figcaption>
        </figure>
      </div>
      <div class="page4">
        <figure>
          <img src="photos/icon-trending-up.svg" alt="icon-trending-up">
          <h2>3.1 x</h2>
          <figcaption>
            <h3>Graduation lift</h3>
            <p>In 14 countries, from Kenya to Guatemala.</p>
          </figcaption>
        </figure>
      </div>
    </aside>
    <footer>
      <div>2026 Bridge Collective</div>
      <div>Registered charity 12345678</div>
    </footer>
  </div>
</body>

</html>
